name: Bug report
description: Report reproducible non-security behavior without private data
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities, credentials, or private repository content here. Follow SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Use a minimal synthetic reproduction and redact machine-specific paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fuzit, Node, pnpm, and operating-system versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
    validations:
      required: true
